<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Gradients & Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#14172B" flood-opacity="0.28"/>
    </filter>
    <radialGradient id="bodyGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFF8E7"/>
      <stop offset="85%" stop-color="#F2E6C8"/>
      <stop offset="100%" stop-color="#E2D4B2"/>
    </radialGradient>
    <linearGradient id="metalRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14172B"/>
      <stop offset="50%" stop-color="#3A4374"/>
      <stop offset="100%" stop-color="#14172B"/>
    </linearGradient>
    <linearGradient id="discGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8484F8"/>
      <stop offset="100%" stop-color="#6B6BE8"/>
    </linearGradient>
  </defs>

  <!-- Shadow under mascot -->
  <ellipse cx="160" cy="285" rx="80" ry="18" fill="#14172B" opacity="0.32" filter="blur(4px)"/>

  <!-- Character Group with Floating Filter -->
  <g filter="url(#shadow)">
    <!-- Antenna -->
    <rect x="156" y="24" width="8" height="32" rx="4" fill="#14172B" />
    <circle cx="160" cy="22" r="14" fill="#6B6BE8" stroke="#14172B" stroke-width="4"/>
    <circle cx="163" cy="19" r="4" fill="#FFF4D9"/>

    <!-- Database Cylinder 3 Tiers -->
    <!-- Bottom Base Tier -->
    <path d="M 70 190 A 90 26 0 0 0 250 190 L 250 240 A 90 26 0 0 1 70 240 Z" fill="#E2D4B2" stroke="#14172B" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="160" cy="240" rx="90" ry="26" fill="url(#bodyGrad)" stroke="#14172B" stroke-width="5"/>

    <!-- Middle Tier -->
    <path d="M 70 135 A 90 26 0 0 0 250 135 L 250 190 A 90 26 0 0 1 70 190 Z" fill="#F2E6C8" stroke="#14172B" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="160" cy="190" rx="90" ry="26" fill="url(#bodyGrad)" stroke="#14172B" stroke-width="5"/>

    <!-- Top Cap Cylinder Tier (Face & Expression) -->
    <path d="M 70 80 A 90 26 0 0 0 250 80 L 250 135 A 90 26 0 0 1 70 135 Z" fill="#FFF8E7" stroke="#14172B" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="160" cy="80" rx="90" ry="26" fill="url(#bodyGrad)" stroke="#14172B" stroke-width="5"/>

    <!-- Cute Eyes -->
    <!-- Left Eye -->
    <ellipse cx="120" cy="115" rx="13" ry="17" fill="#14172B"/>
    <ellipse cx="123" cy="110" rx="5" ry="7" fill="#FFF4D9"/>
    <!-- Right Eye -->
    <ellipse cx="200" cy="115" rx="13" ry="17" fill="#14172B"/>
    <ellipse cx="203" cy="110" rx="5" ry="7" fill="#FFF4D9"/>

    <!-- Cute Happy Smile -->
    <path d="M 144 135 Q 160 152 176 135" fill="none" stroke="#14172B" stroke-width="5" stroke-linecap="round"/>

    <!-- Pink Cheeks -->
    <ellipse cx="102" cy="132" rx="9" ry="5" fill="#FF8A8A" opacity="0.6"/>
    <ellipse cx="218" cy="132" rx="9" ry="5" fill="#FF8A8A" opacity="0.6"/>

    <!-- Floating Hands -->
    <!-- Left Hand -->
    <g transform="translate(38, 140)">
      <circle cx="16" cy="16" r="16" fill="#FFF4D9" stroke="#14172B" stroke-width="4"/>
      <path d="M 6 12 Q 16 4 26 12" fill="none" stroke="#14172B" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Right Hand (Waving) -->
    <g transform="translate(250, 115) rotate(-15)">
      <circle cx="16" cy="16" r="16" fill="#FFF4D9" stroke="#14172B" stroke-width="4"/>
      <!-- Sparkle on hand -->
      <polygon points="16,4 19,13 28,16 19,19 16,28 13,19 4,16 13,13" fill="#6B6BE8"/>
    </g>

    <!-- Data indicator badge on front -->
    <rect x="135" y="210" width="50" height="14" rx="7" fill="#14172B"/>
    <circle cx="145" cy="217" r="3.5" fill="#6B6BE8"/>
    <circle cx="160" cy="217" r="3.5" fill="#34D399"/>
    <circle cx="175" cy="217" r="3.5" fill="#FFF4D9"/>
  </g>
</svg>
